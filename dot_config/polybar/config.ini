;-------------------------
; Catppuccin Mocha Palette
; Maintainer: justTOBBI
;--------------------------

[colors]
rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
text = #cdd6f4
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
base = #1e1e2e
mantle = #181825
crust = #11111b
transparent = #FF00000 

[colors]
 background = ${colors.base}
 background-alt = ${colors.mauve}
 foreground = ${colors.text}
 foreground-alt = ${colors.crust}
 primary = ${colors.mauve}
 secondary = ${colors.mantle}
 alert = ${colors.peach}
 disabled = ${colors.subtext1}

[bar/mybar]
 monitor = ${env:MONITOR:}
 width = 100%
 height = 22
 radius = 3
 #fixed-center = true
 #top = yes
 #bottom = no
 override-redirect = false
 ; Under-/overline pixel size and argb color
 ; Individual values can be defined using:
 ;   {overline,underline}-size
 ;   {overline,underline}-color
 line-size = 5
 line-color = ${colors.background-alt}

 border-top-size = 0
 border-bottom-size = 1
 border-left-size = 0
 border-right-size = 0 

 padding-left = 1
 padding-right = 1

 module-margin = 1


 font-0 = Hack:pixelsize=9;3
 font-2 = Wuncon Siji:pixelsize=10;3
 font-1 = Weather Icons:style=Regular:size=10;2
 font-3 = FontAwesome5Free:style=Solid:pixelsize=10;3
 font-4 = FontAwesome5Brands:style=Solid:pixelsize=10;3
 font-5 = Symbols Nerd Font:style=Regular:pixelsize=10;3

 modules-left = i3 sp2 cpu temperature sp2 notif sp2 SysUp
 modules-right = linux-ver sp2 updates sp2 date weather sp2 tray
 format-background = ${colors.base}

[module/tray]
 type = internal/tray
 format-margin = 8px
 tray-spacing = 8px
 format-background = ${colors.base}
#wm-restack = i3

scroll-up = #i3.next
scroll-down = #i3.prev

cursor-click = pointer

[module/sp2]
 type = custom/text
 format = "|"
 format-foreground = ${colors.foreground}

[module/i3]
 type = internal/i3
 #comment for if i can't reload it for some reason
 #enable-ipc = true
 format = <label-state> <label-mode>
 index-sort = true
 wrapping-scroll = false
 strip-wsnumbers = false
 enable-click = true
 enable-scroll = false

 label-mode = %mode%
 label-mode-padding = 0
 label-mode-foreground = ${colors.foreground-alt}
 label-mode-background = ${colors.background-alt}

 ; focused = Active workspace on focused monitor
 label-focused = %index%
 label-focused-foreground = ${colors.foreground-alt}
 label-focused-background = ${colors.teal}
 label-focused-padding = 1

 ; unfocused = Inactive workspace on any monitor
 label-unfocused = %index%
 label-unfocused-foreground = ${colors.foreground}
 label-unfocused-padding = 0

 ; active = Active workspace on unfocused monitor
 label-active = %index%
 label-active-foreground = ${colors.base}
 label-active-background = ${colors.mauve}
 label-active-underline = ${colors.mauve}
 label-active-padding = 0

 ; urgent = Workspace with urgency hint set
 label-urgent = %index%
 label-urgent-foreground = ${colors.foreground-alt}
 label-urgent-background = ${colors.alert}
 label-urgent-padding = 1

 ; Separator in between workspaces
 label-separator = " | "
 label-separator-padding = 0
 label-separator-foreground = ${colors.foreground}

#[module/info-hackspeed]
# type = custom/script
# exec = ~/.config/polybar/scripts/info-hackspeed.sh
# tail = true

[module/cpu]
 type = internal/cpu
 interval = .5
 warn-percentage = 95
 label = CPU %percentage%
 label-warn = CPU %percentage%
 ramp-coreload-spacing = 1
 ramp-coreload-0 = ▁
 ramp-coreload-1 = ▂
 ramp-coreload-2 = ▃
 ramp-coreload-3 = ▄
 ramp-coreload-4 = ▅
 ramp-coreload-5 = ▆
 ramp-coreload-6 = ▇
 ramp-coreload-7 = █

[module/temperature]
 type = internal/temperature

 ; Seconds to sleep between updates
 ; Default: 1
 interval = 0.5

 ; Thermal zone to use
 ; To list all the zone types, run 
 ; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
 ; Default: 0
 thermal-zone = 0

 ; Select thermal zone by name
 ; The name has to match the contents of /sys/class/thermal/thermal_zone*/type
 ; for the desired thermal zone.
 ; New in version 3.7.0
 #Default: ""
 #zone-type = x86_pkg_temp

 ; Full path of temperature sysfs path
 ; Use `sensors` to find preferred temperature source, then run
 ; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
 ; to find path to desired file
 ; Default reverts to thermal zone setting
 hwmon-path = /sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon1/temp1_input
 ; Base temperature for where to start the ramp (in degrees celsius)
 ; Default: 0
 base-temperature = 20

 ; Threshold temperature to display warning label (in degrees celsius)
 ; Default: 80
 warn-temperature = 60
 ; Whether or not to show units next to the temperature tokens (°C, °F)
 ; Default: true
 units = false

 ; Available tags:
 ;   <label> (default)
 ;   <ramp>
 format = <ramp> <label>

 ; Available tags:
 ;   <label-warn> (default)
 ;   <ramp>
 format-warn = <ramp> <label-warn>

 ; Available tokens:
 ;   %temperature% (deprecated)
 ;   %temperature-c%   (default, temperature in °C)
 ;   %temperature-f%   (temperature in °F)
 ;   %temperature-k%   (temperature in Kelvin, new in version 3.7.0)
 label = TEMP %temperature-c%

 ; Available tokens:
 ;   %temperature% (deprecated)
 ;   %temperature-c%   (default, temperature in °C)
 ;   %temperature-f%   (temperature in °F)
 ;   %temperature-k%   (temperature in Kelvin, new in version 3.7.0)
 label-warn = TEMP %temperature-c%
 label-warn-foreground = ${colors.red}

 ; Requires the <ramp> tag
 ; The icon selection will range from `base-temperature` to `warn-temperature`,
 ; temperatures at and above `warn-temperature` will use the last icon
 ; and temperatures at and below `base-temperature` will use `ramp-0`. 
 ; All other icons are distributed evenly between the two temperatures.
 ramp-0 = A
 ramp-1 = B
 ramp-2 = C
 ramp-foreground = ${colors.base}
[module/SysUp]
 type = custom/script
 exec = ~/.config/polybar/scripts/system-uptime-pretty.sh
 interval = 30

 format-prefix = "%{B#11111b}░▒▓%{B-}"
 format-prefix-foreground = ${colors.background-alt}

 label = %output%
 label-foreground = ${colors.foreground-alt}
 label-background = ${colors.background-alt}
 

 format-suffix = "%{B#11111b}▓▒░%{B-}"
 format-suffix-foreground = ${colors.background-alt}

[module/weather]
 type = custom/script
 exec = ~/.config/polybar/scripts/weather-openmap.sh
 interval = 600

[module/linux-ver]
 type = custom/script
 exec = uname -r
 interval = 600

[module/updates]
 type = custom/script
 exec = ~/.config/polybar/scripts/arch_updates.sh
 interval = 60
 label = %output%

[module/notif]
 type = custom/script
 exec = ~/.config/polybar/scripts/dunst-snooze.sh
 interval = 10
 click-left = ~/.config/polybar/scripts/dunst-snooze.sh --toggle &
 label-forground = ${colors.foreground-alt}
 
[module/date]
 type = internal/date
 interval = 1
 time = " %a %d %I:%M %P "

 format-prefix = "%{B#11111b}░▒▓%{B-}"
 format-prefix-foreground = ${colors.background-alt}

 label = %time%
 label-foreground = ${colors.foreground-alt}
 label-background = ${colors.background-alt}

 format-suffix = "%{B#11111b}▓▒░%{B-}"
 format-suffix-foreground = ${colors.background-alt}

[module/volume]
 type = internal/alsa

 ; Soundcard to be colorsd
 ; Usually in the format hw:# where # is the card number
 ; You can find the different card numbers in `/proc/asound/cards`
 master-soundcard = default
 speaker-soundcard = default
 headphone-soundcard = default

 ; Name of the master, speaker and headphone mixers
 ; colors the following command to list available mixer controls:
 ; $ amixer scontrols | sed -nr "s/.*'{[[:alnum:]]+}'.*/\1/p"
 ; If master, speaker or headphone-soundcard isn't the default,
 ; colors `amixer -c # scontrols` instead where # is the number
 ; of the master, speaker or headphone soundcard respectively
 ;
 ; Default: Master
 master-mixer = Master

 format-volume = "<label-volume><bar-volume>"
 label-volume = " "
 label-volume-foreground = ${colors.foreground-alt}
 label-volume-background = ${colors.background-alt}

 format-muted-prefix = " "
 format-muted-foreground = ${colors.foreground-alt}
 format-muted-background = ${colors.background-alt}
 label-muted = MUTED

 bar-volume-width = 5
 bar-volume-foreground-0 = ${colors.foreground-alt}
 bar-volume-foreground-1 = ${colors.foreground-alt}
 bar-volume-foreground-2 = ${colors.foreground-alt}
 bar-volume-foreground-3 = ${colors.foreground-alt}
 bar-volume-foreground-4 = ${colors.foreground-alt}
 bar-volume-foreground-5 = ${colors.foreground-alt}
 bar-volume-foreground-6 = ${colors.foreground-alt}
 bar-volume-gradient = false
 bar-volume-indicator = []
 bar-volume-indicator-font = 1
 bar-volume-indicator-foreground = ${colors.foreground-alt}
 bar-volume-indicator-background = ${colors.background-alt}
 bar-volume-fill = -
 bar-volume-fill-font = 1
 bar-volume-fill-foreground = ${colors.foreground-alt}
 bar-volume-fill-background = ${colors.background-alt}
 bar-volume-empty = -
 bar-volume-empty-font = 1
 bar-volume-empty-foreground = ${colors.foreground-alt}
 bar-volume-empty-background = ${colors.background-alt}

[settings]
 #throttle-output = 5
 #throttle-output-for = 10
 ;throttle-input-for = 30
 screenchange-reload = true
 compositing-background = over
 compositing-foreground = over
 compositing-overline = over
 compositing-border = over

[global/wm]
 margin-top = 5
 margin-bottom = 5